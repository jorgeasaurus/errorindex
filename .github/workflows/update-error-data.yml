name: Update error data

on:
  schedule:
    - cron: "30 5 3 * *"
  push:
    branches:
      - main
    paths:
      - "public/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # Unpaced scrape was ~14 min. Learn pacing stretched the Intune phase from
    # 8m16s to 17m49s (~2.15x), so a full paced run is ~30 min before the
    # patient 403 backoff (up to ~3 min) and short crawl retries. 30 cancelled
    # run 45558344266 in the tail. 90 covers the paced run plus that backoff.
    timeout-minutes: 90
    concurrency:
      group: update-error-data
      cancel-in-progress: true

    outputs:
      changes_detected: ${{ steps.auto-commit.outputs.changes_detected }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape error documentation
        run: python3 scripts/scrape_errors.py

      - name: Commit updated data
        id: auto-commit
        run: |
          git add public/data/**
          if git diff --cached --quiet; then
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore: update error data"
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.auto-commit.outputs.changes_detected == 'true'
        run: git push

  deploy:
    # Push from GITHUB_TOKEN does not start a new workflow run, so a scheduled
    # scrape still deploys from this job after it pushes. A push of public/**
    # or a manual dispatch deploys main without waiting on the scraper.
    needs: update-data
    if: |
      always() && !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.update-data.outputs.changes_detected == 'true'
      )
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
